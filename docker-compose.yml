services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: aerodoc
      POSTGRES_PASSWORD: aerodoc
      POSTGRES_DB: aerodoc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerodoc -d aerodoc"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
