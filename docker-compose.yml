services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: aerodoc
      POSTGRES_PASSWORD: aerodoc
      POSTGRES_DB: aerodoc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerodoc -d aerodoc"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Web UI to browse the database: http://localhost:8080
  # Login: system "PostgreSQL", server "db", user/password/database "aerodoc".
  adminer:
    image: adminer:latest
    # Listen on IPv4 explicitly: the image default ([::]) fails where IPv6 is disabled.
    command: ["php", "-S", "0.0.0.0:8080", "-t", "/var/www/html"]
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
