# Pipeline configuration (indexing and retrieval). Versioned: every result names its config.
embedding:
  # Small, fast English embedding model (384 dimensions): ~10 chunks/s on 4 CPU cores,
  # about 4x faster than bge-base. Hybrid search and reranking (step 4) recover quality.
  model: BAAI/bge-small-en-v1.5
  dimension: 384
  # bge v1.5 recommends this instruction in front of short search queries (not passages).
  query_prefix: "Represent this sentence for searching relevant passages: "
  batch_size: 32

chunking:
  # ~250 words (~330 tokens): precise enough to cite, large enough to keep context,
  # and under the 512-token limit of the embedding model once the header is added.
  max_words: 250
  overlap_words: 40
  # A chunk ends at a section boundary only if it already has this many words,
  # so that tiny AD sections such as "(d) Subject" are merged with their neighbours.
  min_words: 80
  # Boilerplate sections of directives that never answer a maintenance question.
  skip_sections:
    - Agency
    - Action
    - Addresses
    - For Further Information Contact
    - Comments Invited
    - Confidential Business Information
    - Regulatory Flexibility Act
    - Paperwork Reduction Act
    - Authority for This Rulemaking
    - Regulatory Findings
    - List of Subjects in 14 CFR Part 39

retrieval:
  top_k: 5              # passages given to the LLM
  mode: hybrid          # dense | bm25 | hybrid
  candidates: 30        # passages taken from each retriever before fusion
  rrf_k: 60             # Reciprocal Rank Fusion constant (value from the original paper)
  rerank: true
  rerank_top_n: 20      # fused candidates re-read by the cross-encoder
  reranker_model: cross-encoder/ms-marco-MiniLM-L6-v2
